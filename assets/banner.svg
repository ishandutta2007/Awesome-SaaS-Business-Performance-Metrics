<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="metricCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.28; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.45; transform: scale(1.1) translate(20px, -15px); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes chartFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes wavePulse {
      0% { transform: scale(0.98); opacity: 0.2; }
      50% { transform: scale(1.02); opacity: 0.45; }
      100% { transform: scale(0.98); opacity: 0.2; }
    }
    .orb-ambient { animation: pulseOrb 8s ease-in-out infinite alternate; }
    .card-1 { animation: floatCard1 5.5s ease-in-out infinite; }
    .card-2 { animation: floatCard2 6.5s ease-in-out infinite; }
    .card-3 { animation: floatCard3 7s ease-in-out infinite; }
    .chart-line { stroke-dasharray: 600; stroke-dashoffset: 0; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="orb-ambient">
    <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#orbBlur)" />
    <circle cx="1050" cy="220" r="160" fill="#818cf8" filter="url(#orbBlur)" />
    <circle cx="650" cy="320" r="120" fill="#ec4899" filter="url(#orbBlur)" opacity="0.18" />
  </g>

  <!-- Background Decorative Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Animated Trend Area (Behind text) -->
  <g opacity="0.25">
    <path d="M 50 320 Q 220 280, 400 300 T 700 230 T 950 160 T 1180 90 L 1180 360 L 50 360 Z" fill="url(#chartGrad)" />
    <path d="M 50 320 Q 220 280, 400 300 T 700 230 T 950 160 T 1180 90" fill="none" stroke="#38bdf8" stroke-width="2.5" class="chart-line" />
  </g>

  <!-- FOREGROUND TEXT SECTION (Left aligned, high contrast, clean & crisp) -->
  <g transform="translate(70, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="265" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.2" />
      <circle cx="18" cy="16" r="4.5" fill="#38bdf8" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED INTELLIGENCE</text>
      <text x="212" y="21" fill="#94a3b8" font-size="12" font-weight="600">v2026.1</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 134)">
      <text fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-1">
        Awesome SaaS Metrics
      </text>
      <text x="0" y="44" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5">
        &amp; Business Performance
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="224" fill="#94a3b8" font-size="16" font-weight="400">
      Enterprise SaaS &amp; Open-Source tools for tracking MRR, ARR, Churn, LTV &amp; Unit Economics
    </text>

    <!-- Tech Feature Pills -->
    <g transform="translate(0, 260)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#38bdf8" font-size="14" font-weight="700">📈 MRR &amp; ARR</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(150, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#34d399" font-size="14" font-weight="700">🔄 Churn &amp; LTV</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#a78bfa" font-size="14" font-weight="700">⚡ Stripe &amp; Billing</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(480, 0)">
        <rect width="156" height="34" rx="8" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1" />
        <text x="14" y="22" fill="#f43f5e" font-size="14" font-weight="700">🔓 100% Free / OSS</text>
      </g>
    </g>
  </g>

  <!-- FOREGROUND FLOATING DYNAMIC METRIC CARDS (Right side - clear of text) -->
  <!-- Card 1: MRR Growth -->
  <g class="card-1" transform="translate(860, 50)">
    <rect width="250" height="82" rx="12" fill="url(#metricCardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="20" y="30" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Monthly Recurring Rev</text>
    <text x="20" y="62" fill="#f8fafc" font-size="24" font-weight="800">$142,850</text>
    <rect x="160" y="42" width="70" height="24" rx="6" fill="#065f46" fill-opacity="0.7" />
    <text x="172" y="58" fill="#34d399" font-size="12" font-weight="700">+18.4% ↗</text>
  </g>

  <!-- Card 2: Net Churn Rate -->
  <g class="card-2" transform="translate(890, 150)">
    <rect width="240" height="76" rx="12" fill="url(#metricCardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="20" y="28" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Net Revenue Churn</text>
    <text x="20" y="58" fill="#38bdf8" font-size="22" font-weight="800">-0.8%</text>
    <text x="96" y="57" fill="#64748b" font-size="12" font-weight="500">(Net Negative)</text>
    <!-- Mini SVG sparkline -->
    <path d="M 175 55 L 188 52 L 200 56 L 212 45 L 222 42" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Card 3: Customer LTV / CAC -->
  <g class="card-3" transform="translate(840, 244)">
    <rect width="260" height="78" rx="12" fill="url(#metricCardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="20" y="28" fill="#94a3b8" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="0.5">LTV to CAC Ratio</text>
    <text x="20" y="60" fill="#a78bfa" font-size="24" font-weight="800">4.8x</text>
    <rect x="150" y="40" width="90" height="24" rx="6" fill="#4c1d95" fill-opacity="0.6" />
    <text x="160" y="56" fill="#e9d5ff" font-size="11" font-weight="700">Healthy &gt; 3.0x</text>
  </g>
</svg>
